name: Release Narsika
# Two ways to publish a release:
# - push a version tag: git tag v0.9.0 && git push origin v0.9.0
# - Actions -> Release Narsika -> Run workflow on main, with the tag (v0.9.0);
#   the workflow then creates the tag on the tested commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create, for example v0.9.0. It must match app/version.py.'
        required: true
permissions:
  contents: read
jobs:
  release:
    # A manual release is only created from main.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      # Passed through the environment, never interpolated into scripts.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the tag against app/version.py and CHANGELOG.md
        run: python tools/release_check.py "$RELEASE_TAG" --notes "$RUNNER_TEMP/notes.md"
      - name: Refuse to reuse an existing tag for a manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG already exists. Push the tag instead, or bump the version." >&2
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y libssh-4 iputils-ping openssh-client
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/install_collections.py --collections-path "$RUNNER_TEMP/collections"
      - name: Test the release source
        run: python -m pytest -q
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ runner.temp }}/collections
      - name: Build the release archive and checksum
        run: |
          version="${RELEASE_TAG#v}"
          python tools/package_release.py "dist/narsika-${version}.zip"
          cd dist && sha256sum "narsika-${version}.zip" > "narsika-${version}.zip.sha256"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Creates the tag on exactly the commit that was tested above.
            placement=(--target "$GITHUB_SHA")
          else
            placement=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --title "Narsika ${RELEASE_TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${placement[@]}"
