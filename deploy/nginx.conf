# Replace narsika.example and certificate paths with the site's real values.
# Bind Narsika to 127.0.0.1:8000; enable NARSIKA_TRUST_PROXY_HOPS=1
# and NARSIKA_COOKIE_SECURE=true only when this proxy is the sole entry point.
server {
    listen 80;
    server_name narsika.example;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name narsika.example;
    ssl_certificate /etc/narsika/tls/fullchain.pem;
    ssl_certificate_key /etc/narsika/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Overwrite, never append an untrusted incoming forwarded address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
