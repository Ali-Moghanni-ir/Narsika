name: narsika
services:
  narsika:
    build: .
    image: narsika:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # Published-port traffic can reach the app from the gateway; the source guard allows it.
      NARSIKA_DOCKER_GATEWAY: ${NARSIKA_DOCKER_GATEWAY:-198.18.250.1}
    networks:
      - narsika
    ports:
      - "${NARSIKA_BIND_ADDRESS:-0.0.0.0}:${NARSIKA_PORT:-8000}:8000"
    volumes:
      - narsika-data:/var/lib/narsika
    stop_grace_period: 330s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  bootstrap:
    image: narsika:local
    profiles: ["setup"]
    env_file:
      - .env
    volumes:
      - narsika-data:/var/lib/narsika
    network_mode: none
    entrypoint: ["python", "tools/bootstrap.py"]
    logging:
      driver: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  narsika-data:
networks:
  # RFC 2544 benchmark range: never used by enterprise LANs, so device routes cannot collide
  # with Docker's default 172.17.0.0-172.31.255.255 pools or common 10/8 and 192.168/16 subnets.
  narsika:
    driver: bridge
    ipam:
      config:
        - subnet: ${NARSIKA_DOCKER_SUBNET:-198.18.250.0/24}
          gateway: ${NARSIKA_DOCKER_GATEWAY:-198.18.250.1}
