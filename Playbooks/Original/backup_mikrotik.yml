- name: Backup MikroTik Configuration
  hosts: all
  gather_facts: false
  tasks:
  - name: Run '/export' on MikroTik device
    community.routeros.command:
      commands:
      - /export
    register: mikrotik_config
    no_log: true
  - name: Save configuration to a file
    copy:
      content: '{{ mikrotik_config.stdout[0] }}'
      dest: '{{ narsika_artifact_root }}/mikrotik_{{ inventory_hostname }}_config.rsc'
      mode: '0600'
    no_log: true
    delegate_to: localhost
    become: false
    vars:
      ansible_connection: local
      ansible_python_interpreter: '{{ ansible_playbook_python }}'
  vars:
    narsika_artifact_root: '{{ playbook_dir }}/../instance/manual-backups'
  pre_tasks:
  - name: Create private backup directory
    ansible.builtin.file:
      path: '{{ narsika_artifact_root }}'
      state: directory
      mode: '0700'
    delegate_to: localhost
    become: false
    vars:
      ansible_connection: local
      ansible_python_interpreter: '{{ ansible_playbook_python }}'
