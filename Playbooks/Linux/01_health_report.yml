---
- name: Narsika | Linux health report
  hosts: '{{ narsika_targets | default("linux") }}'
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    narsika_artifact_root: '{{ playbook_dir }}/../artifacts'
  pre_tasks:
  - name: Validate platform and SSH connection
    ansible.builtin.assert:
      that:
      - ansible_connection in ["ssh", "ansible.builtin.ssh"]
      fail_msg: Use the linux inventory group and the ssh connection.
  - name: Read-only collection requires normal mode
    ansible.builtin.assert:
      that:
      - not ansible_check_mode
      fail_msg: Do not use --check for this collector. It reads the server and writes a local artifact.
  tasks:
  - name: Read system facts without sudo
    ansible.builtin.setup:
      gather_subset:
      - '!all'
      - hardware
      - network
      - virtual
      gather_timeout: 30
  - name: Require Linux
    ansible.builtin.assert:
      that:
      - ansible_facts.system == "Linux"
      fail_msg: This Playbook supports Linux servers only.
  - name: Read load, memory, filesystems and failed units
    ansible.builtin.command:
      argv: '{{ item }}'
    loop:
    - [uptime]
    - [df, -P, -h, -l]
    - [free, -m]
    - [systemctl, list-units, --state=failed, --no-legend, --plain, --no-pager]
    loop_control:
      label: '{{ item | join(" ") }}'
    environment:
      LC_ALL: C
    register: _commands
    changed_when: false
    failed_when: false
  - name: Keep each command with its exit status and output
    ansible.builtin.set_fact:
      _command_report: '{{ _command_report | default([]) + [{"command": item.item | join(" "), "rc": item.rc | default(none), "output": item.stdout | default("")}] }}'
    loop: '{{ _commands.results }}'
    loop_control:
      label: '{{ item.item | join(" ") }}'
  - name: Create restricted artifact root
    ansible.builtin.file:
      path: '{{ narsika_artifact_root }}'
      state: directory
      mode: '0700'
    delegate_to: localhost
    become: false
    vars:
      ansible_connection: local
      ansible_become: false
      ansible_python_interpreter: '{{ ansible_playbook_python }}'
  - name: Allocate a unique directory for this host and run
    ansible.builtin.tempfile:
      state: directory
      path: '{{ narsika_artifact_root }}'
      prefix: host_{{ inventory_hostname | regex_replace("[^A-Za-z0-9_.-]", "_") }}_
    register: _artifact
    delegate_to: localhost
    become: false
    vars:
      ansible_connection: local
      ansible_become: false
      ansible_python_interpreter: '{{ ansible_playbook_python }}'
  - name: Write a restricted health report
    ansible.builtin.copy:
      dest: '{{ _artifact.path }}/health-report.json'
      mode: '0600'
      content: |
        {{ {"host": inventory_hostname,
            "system": {"hostname": ansible_facts.hostname | default(none),
                       "fqdn": ansible_facts.fqdn | default(none),
                       "distribution": ansible_facts.distribution | default(none),
                       "distribution_version": ansible_facts.distribution_version | default(none),
                       "kernel": ansible_facts.kernel | default(none),
                       "architecture": ansible_facts.architecture | default(none),
                       "virtualization_type": ansible_facts.virtualization_type | default(none),
                       "virtualization_role": ansible_facts.virtualization_role | default(none),
                       "vcpus": ansible_facts.processor_vcpus | default(none),
                       "memory_total_mb": ansible_facts.memtotal_mb | default(none),
                       "uptime_seconds": ansible_facts.uptime_seconds | default(none),
                       "default_ipv4": ansible_facts.default_ipv4 | default({}),
                       "interfaces": ansible_facts.interfaces | default([]) | sort},
            "commands": _command_report} | to_nice_json }}
    delegate_to: localhost
    become: false
    vars:
      ansible_connection: local
      ansible_become: false
      ansible_python_interpreter: '{{ ansible_playbook_python }}'
  - name: Report location
    ansible.builtin.debug:
      msg: '{{ _artifact.path }}/health-report.json'
