---
- name: Narsika | Configure an access port
  hosts: '{{ narsika_targets | default("cisco") }}'
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    narsika_apply: false
    narsika_artifact_root: '{{ playbook_dir }}/../artifacts'
    interface_name: null
    access_vlan: null
    interface_description: null
    allow_trunk_conversion: false
    save_config: false
  pre_tasks:
  - name: Validate platform and SSH connection
    ansible.builtin.assert:
      that:
      - ansible_connection == "ansible.netcommon.network_cli"
      - ansible_network_os == "cisco.ios.ios"
      fail_msg: Use the matching inventory group and network_cli platform.
  - name: Require a boolean execution flag
    ansible.builtin.assert:
      that:
      - narsika_apply is boolean
      fail_msg: Set narsika_apply to YAML/JSON true or false, not a string.
  - name: Validate access port input
    ansible.builtin.assert:
      that:
      - interface_name is string
      - interface_name is match("^(FastEthernet|GigabitEthernet|TenGigabitEthernet|TwentyFiveGigE|FortyGigabitEthernet|HundredGigE)[0-9]+(/[0-9]+){0,3}$")
      - access_vlan | string is match("^[0-9]+$")
      - access_vlan | int >= 2
      - access_vlan | int <= 4094
      - access_vlan | int not in [1002, 1003, 1004, 1005]
      - interface_description is string
      - interface_description is match("^[A-Za-z0-9 _.,:/()-]{1,80}$")
      - allow_trunk_conversion is boolean
      - save_config is boolean
      fail_msg: Provide a full physical interface name, VLAN and single-line ASCII description.
  tasks:
  - name: Planned access port configuration
    ansible.builtin.debug:
      msg:
      - interface {{ interface_name }}
      - ' description {{ interface_description }}'
      - ' switchport mode access'
      - ' switchport access vlan {{ access_vlan }}'
  - name: Execution mode
    ansible.builtin.debug:
      msg:
        apply: '{{ narsika_apply }}'
        check_mode: '{{ ansible_check_mode }}'
        note: Preview by default. Device write tasks require narsika_apply=true and normal mode.
  - name: Apply the reviewed operation to one host
    when: narsika_apply | bool and not ansible_check_mode
    block:
    - name: Read existing switchport and VLAN state
      cisco.ios.ios_command:
        commands:
        - show interfaces {{ interface_name }} switchport
        - show vlan id {{ access_vlan }}
      register: _port
      changed_when: false
    - name: Require a Layer 2 port and an existing VLAN
      ansible.builtin.assert:
        that:
        - '"Switchport: Enabled" in _port.stdout[0]'
        - not (_port.stdout[1] is search("(?i)(not found|Invalid input|not configured)"))
        - allow_trunk_conversion or not (_port.stdout[0] is search("(?im)^(Administrative|Operational) Mode:.*trunk"))
        fail_msg: The interface must be a Layer 2 switchport and the VLAN must exist. Trunk conversion needs explicit
          opt-in.
    - name: Create restricted artifact root
      ansible.builtin.file:
        path: '{{ narsika_artifact_root }}'
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
    - name: Allocate a unique directory for this host and run
      ansible.builtin.tempfile:
        state: directory
        path: '{{ narsika_artifact_root }}'
        prefix: host_{{ inventory_hostname | regex_replace("[^A-Za-z0-9_.-]", "_") }}_
      register: _artifact
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
    - name: Capture running configuration before any change
      cisco.ios.ios_config:
        backup: true
        backup_options:
          dir_path: '{{ _artifact.path }}'
          filename: running-config.cfg
        save_when: never
      register: _backup
      no_log: true
    - name: Restrict configuration file permissions
      ansible.builtin.file:
        path: '{{ _backup.backup_path }}'
        mode: '0600'
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
    - name: Configure only the chosen access port fields
      cisco.ios.ios_config:
        parents:
        - interface {{ interface_name }}
        lines:
        - description {{ interface_description }}
        - switchport mode access
        - switchport access vlan {{ access_vlan }}
        match: line
        save_when: '{{ "changed" if save_config else "never" }}'
    - name: Read resulting port state
      cisco.ios.ios_command:
        commands:
        - show interfaces {{ interface_name }} switchport
        wait_for:
        - result[0] contains static access
        - 'result[0] contains Access Mode VLAN: {{ access_vlan }}'
        retries: 2
        interval: 1
      changed_when: false
    - name: Before-change backup
      ansible.builtin.debug:
        msg: '{{ _backup.backup_path }}'
