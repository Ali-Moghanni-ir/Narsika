---
- name: Narsika | Health and interface report
  hosts: '{{ narsika_targets | default("cisco") }}'
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    narsika_apply: false
    narsika_artifact_root: '{{ playbook_dir }}/../artifacts'
  pre_tasks:
  - name: Validate platform and SSH connection
    ansible.builtin.assert:
      that:
      - ansible_connection == "ansible.netcommon.network_cli"
      - ansible_network_os == "cisco.ios.ios"
      fail_msg: Use the matching inventory group and network_cli platform.
  - name: Read-only collection requires normal mode
    ansible.builtin.assert:
      that:
      - not ansible_check_mode
      fail_msg: Do not use --check for this collector. It reads the device and writes a local artifact.
  tasks:
  - name: Create restricted artifact root
    ansible.builtin.file:
      path: '{{ narsika_artifact_root }}'
      state: directory
      mode: '0700'
    delegate_to: localhost
    become: false
    vars:
      ansible_connection: local
      ansible_become: false
      ansible_python_interpreter: '{{ ansible_playbook_python }}'
  - name: Allocate a unique directory for this host and run
    ansible.builtin.tempfile:
      state: directory
      path: '{{ narsika_artifact_root }}'
      prefix: host_{{ inventory_hostname | regex_replace("[^A-Za-z0-9_.-]", "_") }}_
    register: _artifact
    delegate_to: localhost
    become: false
    vars:
      ansible_connection: local
      ansible_become: false
      ansible_python_interpreter: '{{ ansible_playbook_python }}'
  - name: Collect operational diagnostics
    cisco.ios.ios_command:
      commands:
      - show version
      - show ip interface brief
      - show processes cpu
      - show interfaces
    register: _report
    changed_when: false
    no_log: true
    failed_when: _report.stdout | join('\n') is search('(?im)^% (Invalid|Error|Incomplete|Ambiguous)')
  - name: Write a restricted diagnostic report
    ansible.builtin.copy:
      dest: '{{ _artifact.path }}/health-report.json'
      mode: '0600'
      content: |
        {{ {"host": inventory_hostname, "commands": ["show version", "show ip interface brief", "show processes cpu", "show interfaces"], "output": _report.stdout} | to_nice_json }}
    no_log: true
    delegate_to: localhost
    become: false
    vars:
      ansible_connection: local
      ansible_become: false
      ansible_python_interpreter: '{{ ansible_playbook_python }}'
  - name: Report location
    ansible.builtin.debug:
      msg: '{{ _artifact.path }}/health-report.json'
