---
- name: Narsika | Ensure a VLAN
  hosts: '{{ narsika_targets | default("cisco") }}'
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    narsika_apply: false
    narsika_artifact_root: '{{ playbook_dir }}/../artifacts'
    vlan_id: null
    vlan_name: null
    save_config: false
  pre_tasks:
  - name: Validate platform and SSH connection
    ansible.builtin.assert:
      that:
      - ansible_connection == "ansible.netcommon.network_cli"
      - ansible_network_os == "cisco.ios.ios"
      fail_msg: Use the matching inventory group and network_cli platform.
  - name: Require a boolean execution flag
    ansible.builtin.assert:
      that:
      - narsika_apply is boolean
      fail_msg: Set narsika_apply to YAML/JSON true or false, not a string.
  - name: Validate VLAN input
    ansible.builtin.assert:
      that:
      - vlan_id is not none
      - vlan_id | string is match("^[0-9]+$")
      - vlan_id | int >= 2
      - vlan_id | int <= 4094
      - vlan_id | int not in [1002, 1003, 1004, 1005]
      - vlan_name is string
      - vlan_name is match("^[A-Za-z0-9_-]{1,32}$")
      - save_config is boolean
      fail_msg: Specify a non-reserved VLAN 2–4094, a simple name and boolean save_config.
  tasks:
  - name: Planned configuration
    ansible.builtin.debug:
      msg:
      - vlan {{ vlan_id }}
      - ' name {{ vlan_name }}'
  - name: Execution mode
    ansible.builtin.debug:
      msg:
        apply: '{{ narsika_apply }}'
        check_mode: '{{ ansible_check_mode }}'
        note: Preview by default. Device write tasks require narsika_apply=true and normal mode.
  - name: Apply the reviewed operation to one host
    when: narsika_apply | bool and not ansible_check_mode
    block:
    - name: Create restricted artifact root
      ansible.builtin.file:
        path: '{{ narsika_artifact_root }}'
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
    - name: Allocate a unique directory for this host and run
      ansible.builtin.tempfile:
        state: directory
        path: '{{ narsika_artifact_root }}'
        prefix: host_{{ inventory_hostname | regex_replace("[^A-Za-z0-9_.-]", "_") }}_
      register: _artifact
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
    - name: Capture running configuration before any change
      cisco.ios.ios_config:
        backup: true
        backup_options:
          dir_path: '{{ _artifact.path }}'
          filename: running-config.cfg
        save_when: never
      register: _backup
      no_log: true
    - name: Restrict configuration file permissions
      ansible.builtin.file:
        path: '{{ _backup.backup_path }}'
        mode: '0600'
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
    - name: Ensure the selected VLAN and name
      cisco.ios.ios_config:
        parents:
        - vlan {{ vlan_id }}
        lines:
        - name {{ vlan_name }}
        match: line
        save_when: '{{ "changed" if save_config else "never" }}'
    - name: Verify VLAN presence
      cisco.ios.ios_command:
        commands:
        - show vlan id {{ vlan_id }}
        wait_for:
        - result[0] contains {{ vlan_name }}
        retries: 2
        interval: 1
      changed_when: false
    - name: Before-change backup
      ansible.builtin.debug:
        msg: '{{ _backup.backup_path }}'
