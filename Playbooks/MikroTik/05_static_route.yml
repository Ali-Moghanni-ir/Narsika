---
- name: Narsika | Ensure a static IPv4 route
  hosts: '{{ narsika_targets | default("mikrotik") }}'
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    narsika_apply: false
    narsika_artifact_root: '{{ playbook_dir }}/../artifacts'
    route_name: null
    route_destination: null
    route_gateway: null
    route_distance: 1
    allow_default_route: false
    _ipv4_re: (?:(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])
  pre_tasks:
  - name: Validate platform and SSH connection
    ansible.builtin.assert:
      that:
      - ansible_connection == "ansible.netcommon.network_cli"
      - ansible_network_os == "community.routeros.routeros"
      fail_msg: Use the matching inventory group and network_cli platform.
  - name: Require a boolean execution flag
    ansible.builtin.assert:
      that:
      - narsika_apply is boolean
      fail_msg: Set narsika_apply to YAML/JSON true or false, not a string.
  - name: Require RouterOS 7 before reading configuration
    when: narsika_apply | bool and not ansible_check_mode
    block:
    - name: Read RouterOS version
      community.routeros.command:
        commands:
        - :put [/system resource get version]
      register: _version
      changed_when: false
    - name: Check the supported RouterOS major version
      ansible.builtin.assert:
        that:
        - _version.stdout[0] | trim is match("^7[.]")
        fail_msg: These playbooks target RouterOS 7. RouterOS 6 needs a separate reviewed export path.
  - name: Validate route input
    ansible.builtin.assert:
      that:
      - route_name is string
      - route_name is match("^[A-Za-z0-9_-]{1,48}$")
      - route_destination is string
      - route_destination is match("^" ~ _ipv4_re ~ "/([0-9]|[12][0-9]|3[0-2])$")
      - (route_destination.split("/")[0].split(".")[0] | int * 16777216 + route_destination.split("/")[0].split(".")[1]
        | int * 65536 + route_destination.split("/")[0].split(".")[2] | int * 256 + route_destination.split("/")[0].split(".")[3]
        | int) % (2 ** (32 - (route_destination.split("/")[1] | int))) == 0
      - route_gateway is string
      - route_gateway is match("^" ~ _ipv4_re ~ "$")
      - route_distance | string is match("^[0-9]+$")
      - route_distance | int >= 1
      - route_distance | int <= 254
      - allow_default_route is boolean
      - allow_default_route or not route_destination.endswith("/0")
      fail_msg: Provide a route name, canonical IPv4 network, gateway and distance 1–254. A /0 route requires allow_default_route=true.
  tasks:
  - name: Planned static route
    ansible.builtin.debug:
      msg:
        name: '{{ route_name }}'
        destination: '{{ route_destination }}'
        gateway: '{{ route_gateway }}'
        distance: '{{ route_distance }}'
        table: main
        policy: Create if absent. Fail on an existing conflicting route; never delete a route.
  - name: Execution mode
    ansible.builtin.debug:
      msg:
        apply: '{{ narsika_apply }}'
        check_mode: '{{ ansible_check_mode }}'
        note: Preview by default. Device write tasks require narsika_apply=true and normal mode.
  - name: Apply the reviewed operation to one host
    when: narsika_apply | bool and not ansible_check_mode
    block:
    - name: Create restricted artifact root
      ansible.builtin.file:
        path: '{{ narsika_artifact_root }}'
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
    - name: Allocate a unique directory for this host and run
      ansible.builtin.tempfile:
        state: directory
        path: '{{ narsika_artifact_root }}'
        prefix: host_{{ inventory_hostname | regex_replace("[^A-Za-z0-9_.-]", "_") }}_
      register: _artifact
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
    - name: Read redacted RouterOS 7 configuration
      community.routeros.command:
        commands:
        - /export terse
      register: _export
      changed_when: false
      no_log: true
      failed_when: _export.stdout | join('\n') is search('(?im)(#error exporting|^failure:|syntax error|expected
        end of command)')
    - name: Write restricted text export to the controller
      ansible.builtin.copy:
        dest: '{{ _artifact.path }}/configuration.rsc'
        content: |
          {{ _export.stdout[0] }}
        mode: '0600'
      no_log: true
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_become: false
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
    - name: Ensure the requested RouterOS resource
      community.routeros.command:
        commands:
        - |-
          {
          :local routeTag {{ ("narsika:route:" ~ route_name) | community.routeros.quote_argument_value }};
          :local destination {{ route_destination | community.routeros.quote_argument_value }};
          :local gatewayAddress {{ route_gateway | community.routeros.quote_argument_value }};
          :local metric {{ route_distance | int }};
          :local existing [/ip route find where comment=$routeTag];
          :if ([:len $existing] > 1) do={ :error "Multiple routes share the management tag"; };
          :if ([:len $existing] = 0) do={
            :if ([:len [/ip route find where dst-address=$destination and routing-table="main"]] > 0) do={ :error "A route to this destination already exists; review manually"; };
            /ip route add dst-address=$destination gateway=$gatewayAddress distance=$metric routing-table=main comment=$routeTag disabled=no;
            :put "NARSIKA_CHANGED";
          } else={
            :if (([:tostr [/ip route get $existing dst-address]] != $destination) || ([:tostr [/ip route get $existing gateway]] != $gatewayAddress) || ([/ip route get $existing distance] != $metric) || ([:tostr [/ip route get $existing routing-table]] != "main") || [/ip route get $existing disabled]) do={ :error "Managed route differs; review before changing it"; };
            :put "NARSIKA_UNCHANGED";
          };
          }
      register: _apply
      changed_when: _apply.stdout[0] is search('(?m)^NARSIKA_CHANGED\s*$')
      failed_when: not (_apply.stdout[0] is search('(?m)^NARSIKA_(CHANGED|UNCHANGED)\s*$'))
    - name: Result
      ansible.builtin.debug:
        msg: '{{ _apply.stdout[0] }}'
    - name: Before-change export
      ansible.builtin.debug:
        msg: '{{ _artifact.path }}/configuration.rsc'
