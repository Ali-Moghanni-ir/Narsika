{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><div class="eyebrow">NARSIKA / WORKSPACE</div><h1>Audit log</h1><p>A clear record of who did what, when, and with which result.</p></div><div class="page-actions"><button class="btn " id="export-audit"><i data-icon="download"></i>Export CSV</button></div></div><section class="panel"><div class="toolbar"><input id="audit-search" class="search" type="search" placeholder="Search action, actor or target…" aria-label="Search audit"><select id="audit-result" aria-label="Result"><option value="">All results</option><option>success</option><option>failed</option><option>cancelled</option></select><select id="audit-range" aria-label="Time range"><option value="all">All time</option><option value="24">Last 24 hours</option><option value="168">Last 7 days</option></select></div><div id="audit-table"></div><div class="pagination"><span id="audit-count"></span><div><button class="btn " id="audit-prev">Previous</button><button class="btn " id="audit-next">Next</button></div></div></section>
{% endblock %}
{% block scripts %}<script type="module" src="{{ static_root }}/js/audit.js"></script>{% endblock %}
